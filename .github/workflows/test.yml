name: Backend Test Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Install, build, test, security smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must match package.json engines.node (20.x)
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Backend unit/integration tests
        run: npm test -- --runInBand

      - name: Security smoke
        run: npm run test:security-smoke
