name: Lint and Format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Must match package.json engines.node (20.x) and .github/workflows/test.yml
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check formatting (files changed vs main)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            BASE="origin/main"
          fi
          git fetch --no-tags --depth=1 origin main || true
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|yml|yaml|md)$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No matching files changed"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          npx prettier --check "${files[@]}"
      - name: Lint new security/feature JS (repo-wide eslint is not clean yet)
        run: |
          set -euo pipefail
          npx eslint --no-error-on-unmatched-pattern src/security src/features src/common/http
